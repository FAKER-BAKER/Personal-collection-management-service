{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис коллекций{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    {% include "includes/navigation.html" %}

    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted">
            <p class="mb-0">&copy; <span id="current-year"></span> Сервис управления личными коллекциями</p>
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
